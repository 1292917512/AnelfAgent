<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>AnelfAgent</title><link rel="stylesheet" href="bootstrap.css"><script type="module" src="bootstrap.js"></script></head>
<body><main>
<div class="brand"><img class="brand-mark" src="icon.svg" alt=""><span>AnelfAgent</span></div>
<div id="opening" role="status"><span class="opening-indicator" aria-hidden="true"></span><span id="opening-status"></span></div>
<div id="setup-flow" hidden>
<ol><li class="current" data-text="step1"></li><li data-text="step2"></li><li data-text="step3"></li></ol>
<h1 id="intro-title" data-text="title"></h1><p id="intro-hint" data-text="hint"></p>
<div id="project-question" class="actions" hidden><button id="existing-yes" class="primary" data-text="existingYes"></button><button id="existing-no" data-text="existingNo"></button></div>
<section id="existing-options" hidden>
  <label data-text="oldPath"></label><div class="path"><code id="existing-root"></code><button id="choose-existing" data-text="choose"></button></div>
  <p id="existing-origin" class="repository-origin"></p>
  <label class="check"><input type="checkbox" id="move-project" checked><span data-text="moveProject"></span></label>
  <div id="migration-target"><label data-text="targetPath"></label><div class="path"><code id="target-root"></code><button id="choose-target" data-text="choose"></button></div></div>
  <p id="existing-hint"></p>
</section>
<section id="setup-options" hidden>
  <div id="install-location"><label data-text="path"></label><div class="path"><code id="root"></code><button id="choose" data-text="choose"></button></div><p id="recommendation"></p><p id="storage" role="status"></p></div>
  <details id="source-options"><summary data-text="installOptions"></summary><label for="source" data-text="source"></label><select id="source"><option value="auto" data-text="auto"></option><option value="gitee">Gitee</option><option value="github">GitHub</option></select>
    <div class="download-grid"><div><label for="downloads" data-text="downloads"></label><select id="downloads"><option value="auto" data-text="auto"></option><option value="china" data-text="china"></option><option value="global" data-text="global"></option></select></div><div><label for="pypi" data-text="pypi"></label><select id="pypi"><option value="auto" data-text="followSource"></option></select></div></div>
    <code id="index-url"></code><p id="uv"></p><p data-text="diskHint"></p><p data-text="reuse"></p>
  </details>
</section>
</div>
<div id="progress" hidden><details id="bootstrap-details" class="progress-card"><summary id="bootstrap-progress-toggle"><span id="status" aria-live="polite"></span><svg class="progress-chevron" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m4 6 4 4 4-4"/></svg><progress id="bootstrap-meter" aria-labelledby="status"></progress></summary><div class="progress-details"><pre id="output"></pre></div></details></div>
<div id="setup-actions" class="actions" hidden><button id="back-choice" class="quiet" hidden data-text="back"></button><button id="cancel" hidden data-text="cancel"></button><button id="continue" class="primary" hidden disabled data-text="continue"></button></div>
<div id="connection-actions" class="actions" hidden><button id="retry-connect" data-text="reconnect"></button></div>
<div id="exit-actions" class="actions" hidden><button id="exit-return" data-text="exitReturn"></button><button id="exit-only" data-text="exitOnly"></button></div>
<p id="exit-hint" data-text="exitHint" hidden></p>
<footer id="bootstrap-footer" data-text="footer" hidden></footer></main></body></html>
