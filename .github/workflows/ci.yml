name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 路径感知：仅 Python 改动跳过前端 job、仅前端改动跳过 Python job，
  # 文档类提交两个 job 都跳过；手动触发（workflow_dispatch）无视过滤全量跑
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            frontend:
              - 'web/frontend/**'
              - '.github/workflows/ci.yml'

  python:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv.lock 中 registry 为清华镜像，CI 覆盖为 PyPI 重解析（不用 --locked）
      - name: Install dependencies
        run: uv sync
        env:
          UV_INDEX_URL: https://pypi.org/simple

      - name: Ruff
        run: uv run ruff check .

      # 三平台 typeshed 条件校验：sys.platform 收窄差异会让本地（如 macOS）
      # 全绿而 CI（Linux）报错，三平台同跑根治此类"本地绿 CI 红"
      - name: Mypy (core 严格层，必过；三平台)
        run: |
          uv run mypy core/ --platform linux
          uv run mypy core/ --platform darwin
          uv run mypy core/ --platform win32

      - name: Mypy (全量基线观察)
        run: uv run mypy .
        continue-on-error: true

      - name: Pytest + Coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term -n auto

      - name: Upload coverage report
        if: always()  # pytest 失败时也上传，便于排查
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build
