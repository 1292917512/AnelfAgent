name: Launcher packages

on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release version
        run: node version.cjs
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'launcher-v' + require('./package.json').version) process.exit(1)"
      - name: Check native shell
        run: pnpm typecheck && pnpm test
      - uses: astral-sh/setup-uv@v5
      - name: Check native terminal, installation and cancellation
        working-directory: .
        run: uv run --no-project --isolated --python 3.12 --with pytest==8.4.2 --with-requirements app/runtime-requirements.txt python -m pytest -c app/tests/isolated.ini --confcutdir=app/tests app/tests -q
      - name: Package native application
        run: pnpm dist --${{ matrix.platform }} --${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: launcher-*
          path: app/dist
          merge-multiple: true
      - name: Verify source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" --jq '.workflow_runs[0].conclusion')
          if [ "$result" != success ]; then
            echo "The source commit must pass CI before publishing (result: $result)." >&2
            exit 1
          fi
      - name: Verify packages and create checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#launcher-v}
          for artifact in "win-x64.exe" "mac-x64.dmg" "mac-arm64.dmg" "linux-x64.AppImage" "linux-x64.deb"; do
            test -s "app/dist/AnelfAgent-$version-$artifact"
          done
          cd app/dist
          sha256sum *.exe *.dmg *.AppImage *.deb > SHA256SUMS.txt
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > app/build-release.json 2>/dev/null; then
            test "$(jq -r .isDraft app/build-release.json)" = true
            gh release upload "$RELEASE_TAG" app/dist/* --clobber
          else
            gh release create "$RELEASE_TAG" app/dist/* --draft --verify-tag --title "AnelfAgent ${RELEASE_TAG#launcher-v}" --notes-file app/RELEASE_NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
