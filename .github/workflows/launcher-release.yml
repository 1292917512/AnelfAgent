name: Launcher packages

on:
  push:
    tags: ["v*", "launcher-v*"]
  workflow_dispatch:
    inputs:
      replace_existing:
        description: Replace assets on the existing version's Release without changing its tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release version
        run: node version.cjs
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const v=require('./package.json').version;if(!['v'+v,'launcher-v'+v].includes(process.env.GITHUB_REF_NAME))process.exit(1)"
      - name: Check native shell
        run: pnpm typecheck && pnpm test
      - uses: astral-sh/setup-uv@v5
      - name: Check native terminal, installation and cancellation
        working-directory: .
        run: uv run --no-project --isolated --python 3.12 --with-requirements app/tests/requirements.txt python -m pytest -c app/tests/isolated.ini --confcutdir=app/tests app/tests -q
      - name: Package native application
        run: pnpm dist --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Verify Windows upgrade preserves data and replaces application files
        if: runner.os == 'Windows'
        run: node tests/installer.smoke.mjs && node tests/installer-upgrade.smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.replace_existing == true
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release target
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_EXISTING: ${{ inputs.replace_existing == true }}
        run: |
          if [ "$REPLACE_EXISTING" = true ]; then
            tag="v$(node -p "require('./app/desktop/package.json').version")"
            gh release view "$tag" --json isDraft --jq 'if .isDraft then error("Replacement requires a published Release") else true end'
            original=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
            echo "ORIGINAL_TAG_OBJECT=$original" >> "$GITHUB_ENV"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          pattern: launcher-*
          path: app/dist
          merge-multiple: true
      - name: Verify source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '.workflow_runs | sort_by(.created_at, .id) | last | .conclusion')
          if [ "$result" != success ]; then
            echo "The source commit must pass CI before publishing (result: $result)." >&2
            exit 1
          fi
      - name: Verify packages and create checksums
        run: |
          version=${RELEASE_TAG#launcher-}
          version=${version#v}
          for artifact in "win-x64.exe" "mac-x64.dmg" "mac-arm64.dmg" "linux-x86_64.AppImage" "linux-amd64.deb"; do
            test -s "app/dist/AnelfAgent-$version-$artifact" || { echo "Missing package: $artifact" >&2; ls -l app/dist; exit 1; }
          done
          cd app/dist
          sha256sum *.exe *.dmg *.AppImage *.deb > SHA256SUMS.txt
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_EXISTING: ${{ inputs.replace_existing == true }}
        run: |
          version=${RELEASE_TAG#launcher-}
          version=${version#v}
          if [ "$REPLACE_EXISTING" = true ]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$ORIGINAL_TAG_OBJECT"
            gh release upload "$RELEASE_TAG" app/dist/* --clobber
            cp app/RELEASE_NOTES.md app/build-release-notes.md
            printf '\n安装包构建提交：[%s](https://github.com/%s/commit/%s)。本次仅替换同版本附件，原标签保持不变；对应源码请使用此构建提交。\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> app/build-release-notes.md
            gh release edit "$RELEASE_TAG" --notes-file app/build-release-notes.md
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$ORIGINAL_TAG_OBJECT"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --json isDraft > app/build-release.json 2>/dev/null; then
            test "$(jq -r .isDraft app/build-release.json)" = true
            gh release upload "$RELEASE_TAG" app/dist/* --clobber
          else
            gh release create "$RELEASE_TAG" app/dist/* --draft --verify-tag --title "AnelfAgent $version" --notes-file app/RELEASE_NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
