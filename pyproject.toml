[project]
name = "AnelfTools"
version = "0.3.0"
description = "AnelfAgent — Unified Agent Framework"
readme = "README.md"
requires-python = ">=3.10, <3.12"
dependencies = [
    # 智能体核心（litellm 统一 LLM API，内含 openai 作为传递依赖）
    "litellm>=1.95.0,<2.0.0",
    "orjson>=3.11.9",
    "aiosqlite==0.21.0",
    "pydantic>=2.10.0",
    "fastapi>=0.116.2,<0.140.0",
    "httpx>=0.28.0",
    "aiohttp>=3.9.0",
    "mcp>=1.0.0",
    # 日志
    "loguru>=0.7.0",
    # Web UI
    "sse-starlette>=2.0.0",
    # 网页内容提取
    "readability-lxml>=0.8.1",
    "markdownify>=0.14.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # 通用工具
    "psutil>=7.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    # 图片处理（视觉模型前处理：压缩/格式重编码，如 QQ 的 MPO 转 JPEG）
    "pillow>=10.0.0",
    # 运行时
    "uvicorn>=0.30.0",
    "starlette>=0.48,<1.0",
    # Telegram Bot
    "python-telegram-bot>=22.0",
    # 飞书 / Lark
    "lark-oapi>=1.5.0",
    # Cognee 知识图谱记忆后端（默认安装，uv sync 自动拉取）
    "cognee==1.4.1",
    "chardet>=5,<6",
    "sqlite-vec>=0.1.9",
    "tiktoken>=0.12.0",
    "jieba>=0.42.1",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    # 个人微信（Weixin / iLink Bot API）频道
    "cryptography>=42.0.0",
    "qrcode>=7.4.0",
    "aiolimiter>=1.2.1",
    "asyncpg>=0.31.0",
    "aiomysql>=0.3.2",
    "asyncssh>=2.24.0",
    "funasr>=1.4.1",
    "modelscope>=1.39.1",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "soundfile>=0.14.0",
    "opencc-python-reimplemented>=0.1.7",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
addopts = "--strict-markers"
markers = [
    "unit: 纯 mock/纯函数/tmp_path 的快速单元测试（tests/unit/ 下自动标记）",
    "integration: 真实应用组装或需外部服务/凭证（tests/integration/ 下自动标记）",
    "slow: 运行较慢的用例，可用 -m 'not slow' 排除",
]

[tool.coverage.run]
source = ["agent", "core", "services", "entities", "channels", "web"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["channels/nonebot_bridge/sources", 
    ".venv",
    "workspace",
    "web/frontend/node_modules",
    "config",
]

[tool.ruff.lint]
# F: Pyflakes（死代码/未定义名）; E9: 语法错误; W6: 废弃用法; I: import 排序
# UP: pyupgrade（渐进开启）; B: bugbear 常见坑
select = ["F", "E9", "W6", "I", "B"]
ignore = [
    # 与项目 async 工具风格冲突（工具函数内部自捕获异常返回 JSON）
    "B008",
    # 允许 pytest fixture 风格参数同名遮蔽
    "B023",
]

[tool.ruff.lint.per-file-ignores]
# 测试中允许盲断言异常（pytest.raises(Exception) 语义明确）
"tests/**" = ["B017"]

[tool.mypy]
python_version = "3.10"
# 渐进严格：全仓跑基础检查，core 层逐步收紧
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true
exclude = "(\\.venv|workspace|web/frontend|config|tests|channels/nonebot_bridge/sources)"

[[tool.mypy.overrides]]
module = "core.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# nonebot.* 仅在 worker 子进程代码中引用（worker venv 独立安装，主环境无此包）
module = ["litellm", "cognee", "lark_oapi.*", "nonebot.*"]
ignore_missing_imports = true
